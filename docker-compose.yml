# Local production-like stack: nginx (reverse proxy / load balancer) in front of two app replicas.
#   docker compose --env-file .env up --build
# Browse http://localhost:8088. Secrets come from .env (never committed, never baked into the image).
services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
    deploy:
      replicas: 2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]
    restart: unless-stopped
