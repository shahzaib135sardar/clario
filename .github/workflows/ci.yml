name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm            # build caching: dependencies are restored when package-lock.json is unchanged
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run check:migrations
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co   # placeholder: the build only needs the variable to exist
          VITE_SUPABASE_ANON_KEY: placeholder
      - run: npm run build:server
      - name: Dependency audit (fails on critical; see docs/OPERATIONS.md for the accepted image-size advisory)
        run: npm audit --audit-level=critical
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
