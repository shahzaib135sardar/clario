# Reverse proxy + load balancer in front of the app replicas.
# For real TLS, terminate HTTPS here (or at your cloud load balancer) and keep X-Forwarded-Proto.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Coarse edge limit; the app adds per-user limits behind it.
  limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  upstream clario {
    least_conn;
    server app:8080 max_fails=3 fail_timeout=10s;  # Docker DNS returns every replica; restart nginx after scaling
    keepalive 32;
  }

  map $http_x_forwarded_proto $proto { default $scheme; https https; }

  server {
    listen 80;
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn perip 40;

    location / {
      limit_req zone=edge burst=60 nodelay;
      proxy_pass http://clario;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proto;
      proxy_connect_timeout 3s;
      proxy_read_timeout 70s;
      # Retry another replica on connection errors / 502/503/504 (GETs only, so nothing is double-applied).
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    # Never expose operational endpoints publicly.
    location /api/internal/ { return 404; }
  }
}
