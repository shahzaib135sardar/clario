# Scrape config for a self-hosted Prometheus. /api/internal/metrics needs the METRICS_TOKEN as a bearer token.
# Put the token in a file (mounted from a Kubernetes Secret) and point credentials_file at it.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: clario
    metrics_path: /api/internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/clario-metrics-token
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [clario] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: clario
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:8080"
