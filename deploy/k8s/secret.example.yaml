# TEMPLATE ONLY. Do not commit real values. Create the real Secret with:
#   kubectl -n clario create secret generic clario-secrets --from-env-file=.env.production
# or sync it from your cloud secret manager (External Secrets Operator, Sealed Secrets, ...).
apiVersion: v1
kind: Secret
metadata:
  name: clario-secrets
  namespace: clario
type: Opaque
stringData:
  SUPABASE_URL: "<set-me>"
  SUPABASE_ANON_KEY: "<set-me>"
  GROQ_API_KEY: "<set-me>"
  ANTHROPIC_API_KEY: "<set-me-or-leave-empty>"
  R2_ACCOUNT_ID: "<set-me>"
  R2_BUCKET_NAME: "<set-me>"
  R2_ACCESS_KEY_ID: "<set-me>"
  R2_SECRET_ACCESS_KEY: "<set-me>"
  R2_ENDPOINT: "<set-me>"
  UPSTASH_REDIS_REST_URL: "<set-me>"
  UPSTASH_REDIS_REST_TOKEN: "<set-me>"
  CRON_SECRET: "<long-random-string>"
  METRICS_TOKEN: "<long-random-string>"
