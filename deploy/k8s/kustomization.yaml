apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clario
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob.yaml
  - networkpolicy.yaml
# secret.example.yaml is intentionally not listed: create the real Secret out of band.
images:
  - name: ghcr.io/OWNER/clario
    newTag: latest
