apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clario
  namespace: clario
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 3m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    cert-manager.io/cluster-issuer: letsencrypt   # TLS certificates, renewed automatically
spec:
  ingressClassName: nginx
  tls:
    - hosts: [clario.example.com]
      secretName: clario-tls
  rules:
    - host: clario.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: clario, port: { name: http } } }
