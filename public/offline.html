<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171816">
<title>Clario is offline</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f7f5;color:#171816;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:360px}
.mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 18px;border-radius:12px;background:#171816;color:#fff;font:400 30px/1 Georgia,serif;padding-bottom:5px}
h1{margin:0 0 8px;font:400 28px Georgia,serif}
p{margin:0 0 20px;color:#71736d;line-height:1.6}
button{min-height:44px;padding:0 22px;border:0;border-radius:6px;background:#171816;color:#fff;font:600 15px inherit}
</style>
</head>
<body>
<main>
<div class="mark">c</div>
<h1>You're offline.</h1>
<p>Clario needs a connection to open your documents. Check your internet and try again.</p>
<button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
